<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Dark Soft</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f1a;
  color: white;
  text-align: center;
}

.container {
  padding-top: 100px;
}

h1 {
  font-size: 50px;
  letter-spacing: 3px;
}

p {
  color: #aaa;
  margin-bottom: 30px;
}

.btn {
  padding: 15px 30px;
  background: #00f0ff;
  color: black;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #00c2cc;
}
</style>

</head>
<body>

<div class="container">
  <h1>DARK SOFT</h1>
  <p>Лучшие софты и услуги</p>
  <button class="btn" onclick="alert('Скоро будет 🔥')">
    Купить
  </button>
</div>

</body>
</html>
